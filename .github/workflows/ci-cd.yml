name: SP-PLASTECH ERP — Enterprise CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================
  # 1. Code Quality, Typecheck & Static Analysis
  # ==========================================
  code-quality:
    name: Typecheck & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks Secret Detection
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Install Middleware Dependencies
        run: npm ci --prefix middleware

      - name: Frontend Strict Type Check (Zero Diagnostics)
        run: npm run lint

      - name: Middleware Strict Type Check
        run: npm --prefix middleware run typecheck

      - name: Architecture Boundary Check
        run: npm run check:boundaries

      - name: Circular Dependency Check
        run: npm run check:circular

  # ==========================================
  # 2. Vitest Unit & Characterization Suite
  # ==========================================
  unit-tests:
    name: Unit & Characterization Tests (93 Tests)
    runs-on: ubuntu-latest
    needs: [code-quality]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Run Vitest Unit & Characterization Suite
        run: npm run test:unit

  # ==========================================
  # 3. Frontend Production Build
  # ==========================================
  frontend-build:
    name: Production Bundle Build (Vite)
    runs-on: ubuntu-latest
    needs: [code-quality]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Production Assets
        run: npm run build
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

      - name: Verify Zero Hardcoded Secrets in Distribution Bundle (TC-IDN-1A-02)
        run: |
          test -d frontend/dist
          test -f frontend/dist/index.html
          if grep -ri "gqrelwvmeoqvfnanoutz" frontend/dist; then
            echo "::error::Found hardcoded Supabase URL in production build bundle!"
            exit 1
          fi
          if grep -ri "sb_publishable" frontend/dist; then
            echo "::error::Found hardcoded Supabase publishable key in production build bundle!"
            exit 1
          fi
          echo "✓ Verified zero credentials in production bundle."

      - name: Upload Production Dist Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  # ==========================================
  # 4. Playwright End-to-End Suite
  # ==========================================
  e2e-playwright:
    name: Playwright E2E Test Suite
    runs-on: ubuntu-latest
    needs: [code-quality, frontend-build]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: erp
          POSTGRES_PASSWORD: erp_local_only
          POSTGRES_DB: erp
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://erp:erp_local_only@localhost:5432/erp
      AUTH_DATABASE_URL: postgres://erp:erp_local_only@localhost:5432/erp
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Install Middleware Dependencies
        run: npm ci --prefix middleware

      - name: Install Playwright Chromium Browser & OS Dependencies
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E Suite
        run: npm run test:e2e
        env:
          CI: true

      - name: Upload Playwright Test Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-report
          path: playwright-report/
          retention-days: 14

  # ==========================================
  # 5. Database Synchronization & Verification
  # ==========================================
  sync-database:
    name: Verify & Synchronize Supabase Database
    runs-on: ubuntu-latest
    needs: [frontend-build]
    if: github.ref == 'refs/heads/main' && secrets.VITE_SUPABASE_URL != ''
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies for DB Sync
        run: npm ci

      - name: Run Supabase Database Synchronizer
        run: node scripts/syncPodmanAndCloud.cjs

  # ==========================================
  # 6. Deploy to Cloudflare (Pages & Workers)
  # ==========================================
  deploy-cloudflare:
    name: Deploy to Cloudflare
    runs-on: ubuntu-latest
    needs: [frontend-build, e2e-playwright]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Install Middleware Dependencies
        run: npm ci --prefix middleware

      - name: Build Production Assets
        run: npm run build
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
          VITE_DB_PROVIDER: ${{ secrets.VITE_DB_PROVIDER || 'rest_api' }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      - name: Deploy Frontend to Cloudflare Pages (Wrangler)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy frontend/dist --project-name=${{ secrets.CLOUDFLARE_PROJECT_NAME || 'sp-plastech' }} --branch=main --commit-dirty=true

      - name: Deploy Middleware Worker to Cloudflare (Wrangler)
        uses: cloudflare/wrangler-action@v3
        if: secrets.CLOUDFLARE_API_TOKEN != ''
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: middleware
          command: deploy --config wrangler.jsonc

