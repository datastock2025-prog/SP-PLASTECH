name: SP-PLASTECH ERP — Enterprise CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================
  # 1. Code Quality, Typecheck & Static Analysis
  # ==========================================
  code-quality:
    name: Typecheck & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks Secret Detection
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm install --legacy-peer-deps --no-audit

      - name: Install Middleware Dependencies
        run: npm install --prefix middleware --legacy-peer-deps --no-audit

      - name: Frontend Strict Type Check (Zero Diagnostics)
        run: npm run lint

      - name: Middleware Strict Type Check
        run: npm --prefix middleware run typecheck

      - name: Architecture Boundary Check
        run: npm run check:boundaries

      - name: Circular Dependency Check
        run: npm run check:circular

      - name: Verify Named Column Projections (Zero SELECT *)
        run: node scripts/check-no-select-star.cjs

      - name: Banned Code Patterns Check
        run: node scripts/check-banned-patterns.cjs

      - name: Client Storage Isolation Check
        run: node scripts/check-client-storage.cjs

      - name: Open Source License Governance Check
        run: npm run check:licenses

  # ==========================================
  # 2. Vitest Unit & Characterization Suite
  # ==========================================
  unit-tests:
    name: Unit & Characterization Tests (104 Tests)
    runs-on: ubuntu-latest
    needs: [code-quality]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm install --legacy-peer-deps --no-audit

      - name: Run Vitest Unit & Characterization Suite
        run: npm run test:unit

  # ==========================================
  # 3. Frontend Production Build
  # ==========================================
  frontend-build:
    name: Production Bundle Build (Vite)
    runs-on: ubuntu-latest
    needs: [code-quality]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps --no-audit

      - name: Build Production Assets
        run: npm run build
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

      - name: Verify Zero Hardcoded Secrets in Distribution Bundle (TC-IDN-1A-02)
        run: |
          test -d frontend/dist
          test -f frontend/dist/index.html
          if grep -ri "gqrelwvmeoqvfnanoutz" frontend/dist; then
            echo "::error::Found hardcoded Supabase URL in production build bundle!"
            exit 1
          fi
          if grep -ri "sb_publishable" frontend/dist; then
            echo "::error::Found hardcoded Supabase publishable key in production build bundle!"
            exit 1
          fi
          echo "✓ Verified zero credentials in production bundle."

      - name: Validate Unified Worker Build & Assets
        run: npx wrangler deploy --dry-run

      - name: Enforce Bundle Size Budgets
        run: npm run check:size

      - name: Upload Production Dist Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  # ==========================================
  # 4. Playwright End-to-End Suite
  # ==========================================
  e2e-playwright:
    name: Playwright E2E Test Suite
    runs-on: ubuntu-latest
    needs: [code-quality, frontend-build]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: erp
          POSTGRES_PASSWORD: erp_local_only
          POSTGRES_DB: erp
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://erp:erp_local_only@localhost:5432/erp
      AUTH_DATABASE_URL: postgres://erp:erp_local_only@localhost:5432/erp
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm install --legacy-peer-deps --no-audit

      - name: Install Middleware Dependencies
        run: npm install --prefix middleware --legacy-peer-deps --no-audit

      - name: Install Playwright Chromium Browser & OS Dependencies
        run: npx playwright install --with-deps chromium

      - name: Run Database Migrations on Test Container
        run: node scripts/migrate-hosted-db.cjs
        env:
          DATABASE_URL: postgres://erp:erp_local_only@localhost:5432/erp

      - name: Run Playwright E2E Suite
        run: npm run test:e2e
        env:
          CI: true

      - name: Upload Playwright Test Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-report
          path: playwright-report/
          retention-days: 14


  # ==========================================
  # 6. Deploy to Cloudflare (Pages & Workers)
  # ==========================================
  deploy-cloudflare:
    name: Deploy to Cloudflare
    runs-on: ubuntu-latest
    needs: [frontend-build, e2e-playwright]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      deployments: write
    env:
      HAS_SUPABASE_DB: ${{ secrets.SUPABASE_DATABASE_URL != '' }}
      HAS_CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm install --legacy-peer-deps --no-audit

      - name: Install Middleware Dependencies
        run: npm install --prefix middleware --legacy-peer-deps --no-audit

      - name: Build Production Assets
        run: npm run build
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL || '/api/v1' }}
          VITE_API_URL: ${{ secrets.VITE_API_URL || 'http://localhost:3000' }}

      - name: Apply Migrations to Hosted Database (Supabase)
        if: env.HAS_SUPABASE_DB == 'true'
        env:
          HAS_SUPABASE_DB: ${{ secrets.SUPABASE_DATABASE_URL != '' }}
          SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
        run: node scripts/migrate-hosted-db.cjs

      - name: Deploy Unified Worker with Static Assets (Wrangler)
        uses: cloudflare/wrangler-action@v3
        if: env.HAS_CF_TOKEN == 'true'
        env:
          HAS_CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.jsonc

