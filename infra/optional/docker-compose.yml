# ==============================================================================
# SP-PLASTECH HYBRID MONOREPO — PRODUCTION & DEVELOPMENT DOCKER COMPOSE
# Optimized for 2GB RAM Low-Cost VPS (Memory bounded, resource capped)
# ==============================================================================

version: '3.8'

services:
  # 1. PostgreSQL 16 Enterprise Database
  postgres:
    image: postgres:16-alpine
    container_name: sp-plastech-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres_secure_dev_password_2026}
      POSTGRES_DB: ${DB_NAME:-sp_plastech_erp}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./containers/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-sp_plastech_erp}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - sp_internal_net

volumes:
  postgres_data:
    driver: local

networks:
  sp_internal_net:
    driver: bridge
