services:
  frontend:
    build:
      context: .
      dockerfile: containers/frontend.Dockerfile
    working_dir: /workspace
    command: npm run dev
    environment:
      VITE_API_BASE_URL: /api
      MIDDLEWARE_URL: http://middleware:3001
      DISABLE_HMR: ${DISABLE_HMR:-false}
    ports:
      - "3000:3000"
    volumes:
      - .:/workspace:Z
      - frontend_node_modules:/workspace/node_modules
    depends_on:
      middleware:
        condition: service_started

  middleware:
    build:
      context: ./middleware
      dockerfile: Dockerfile
    working_dir: /app
    command: npm run start:dev
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://reboot:reboot_dev@postgres:5432/reboot_erp
      CORS_ORIGIN: http://localhost:3000
    ports:
      - "3001:3001"
    volumes:
      - ./middleware:/app:Z
      - middleware_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_DB: reboot_erp
      POSTGRES_USER: reboot
      POSTGRES_PASSWORD: reboot_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reboot -d reboot_erp"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  frontend_node_modules:
  middleware_node_modules:
  postgres_data:
