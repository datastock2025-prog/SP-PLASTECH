# ==============================================================================
# SP-PLASTECH ERP — LOCAL PODMAN DEVELOPMENT STACK
# Usage: podman compose up (or docker compose up)
# Replaces legacy multi-compose configurations with single lean 4-service topology
# ==============================================================================

name: sp-plastech-dev

services:
  db:
    image: docker.io/library/postgres:16-alpine
    container_name: sp-plastech-dev-db-1
    environment:
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: ${DEV_DB_PASSWORD:-erp_local_only} # local only; never reused anywhere else
      POSTGRES_DB: erp
    ports: [ "5432:5432" ]
    volumes: [ pgdata:/var/lib/postgresql/data:Z ]
    healthcheck: { test: [ "CMD-SHELL", "pg_isready -U erp" ], interval: 5s, retries: 10 }

  migrate:
    image: ghcr.io/amacneil/dbmate
    command: --migrations-dir /db/migrations --wait up
    environment: { DATABASE_URL: "postgres://erp:${DEV_DB_PASSWORD:-erp_local_only}@db:5432/erp?sslmode=disable" }
    volumes: [ "./db/migrations:/db/migrations:ro,Z" ]
    depends_on: { db: { condition: service_healthy } }

  api:
    image: sp-plastech-dev-api:latest
    build: { context: ./middleware, dockerfile: Dockerfile.dev }
    command: npm run dev
    environment:
      DATABASE_URL: postgres://erp:${DEV_DB_PASSWORD:-erp_local_only}@db:5432/erp
      AUTH_DATABASE_URL: postgres://erp:${DEV_DB_PASSWORD:-erp_local_only}@db:5432/erp
      AUTH_PORT: "4000"
      PORT: "4000"
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-sp_plastech_dev_auth_secret_local_only_2026}
      AUTH_TRUSTED_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000"
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@spplastech.com}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-admin}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-Plas!Tech#Boot91}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-System Administrator}
    ports: [ "4000:4000" ]
    volumes:
      - "./middleware:/app:Z"
      - "/app/node_modules"
    depends_on: { migrate: { condition: service_completed_successfully } }

  web:
    image: sp-plastech-dev-web:latest
    build: { context: ., dockerfile: containers/frontend.Dockerfile }
    command: npm run dev
    environment:
      BACKEND_URL: http://api:4000
      VITE_API_URL: http://localhost:3000
    ports: [ "3000:3000" ] # Vite proxies /api to the api service
    volumes:
      - ".:/workspace:Z"
      - "/workspace/node_modules"
      - "/workspace/frontend/node_modules"
    depends_on: { api: { condition: service_started } }

volumes:
  pgdata:
    name: sp-plastech-dev_pgdata
