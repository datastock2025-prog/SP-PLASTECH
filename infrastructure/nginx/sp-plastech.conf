# ==============================================================================
# SP-PLASTECH NGINX REVERSE PROXY & GATEWAY CONFIGURATION
# Production SSL, Rate Limiting, CORS, and Reverse Proxy for VPS Deployment
# ==============================================================================

# Rate Limiting Zones
# Strict zone for authentication endpoints (prevent brute-force): 5 requests/min per IP
limit_req_zone $binary_remote_addr zone=auth_limit_zone:10m rate=5r/m;

# Relaxed zone for general business API queries: 60 requests/sec per IP
limit_req_zone $binary_remote_addr zone=api_general_zone:20m rate=60r/s;

# Connection limiting: Max 20 concurrent connections per IP
limit_conn_zone $binary_remote_addr zone=conn_limit_zone:10m;

# Upstream NestJS Backend Pool
upstream sp_plastech_backend {
    server 127.0.0.1:3000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# HTTP Redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name api.spplastech.com erp.spplastech.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Main HTTPS Server Block
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.spplastech.com;

    # SSL Certificates & Modern Cipher Suite
    ssl_certificate /etc/letsencrypt/live/api.spplastech.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.spplastech.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Security Headers (Defense-in-Depth)
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Client body and buffer limits for low RAM VPS
    client_max_body_size 25M;
    client_body_buffer_size 128k;

    # 1. Strict Rate-Limited Authentication Routes
    location ~* ^/api/v1/auth/ {
        limit_req zone=auth_limit_zone burst=10 nodelay;
        limit_conn conn_limit_zone 5;

        proxy_pass http://sp_plastech_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Tenant-ID $http_x_tenant_id;
        proxy_read_timeout 30s;
    }

    # 2. General ERP Business API Routes with Caching & Connection Pool
    location /api/ {
        limit_req zone=api_general_zone burst=40 nodelay;
        limit_conn conn_limit_zone 20;

        # Standard CORS Headers
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '$http_origin' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-Tenant-ID, X-CSRF-Token, Cache-Control' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Max-Age' 86400;
            add_header 'Content-Length' 0;
            add_header 'Content-Type' 'text/plain charset=UTF-8';
            return 204;
        }

        proxy_pass http://sp_plastech_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Tenant-ID $http_x_tenant_id;
        proxy_set_header Connection "";

        # Timeouts for Long Report / AI Generation
        proxy_connect_timeout 10s;
        proxy_send_timeout 90s;
        proxy_read_timeout 90s;
    }

    # 3. Healthcheck Endpoint Bypass
    location = /api/health {
        proxy_pass http://sp_plastech_backend/api/health;
        access_log off;
    }
}
